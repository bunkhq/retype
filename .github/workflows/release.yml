name: Release

# Push a tag like v0.2.0 (matching Cargo.toml's version) to build the installers
# and publish a GitHub Release. Retype's update checker reads the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple silicon
          - runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml $v"; exit 1; }
      - run: brew install ffmpeg
      - name: Build DMG
        env:
          RETYPE_SIGN_ID: ${{ secrets.RETYPE_SIGN_ID }}
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.runner }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Fetch ffmpeg
        run: scripts\fetch-ffmpeg-windows.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME != Cargo.toml $v" }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\retype.iss
      - uses: actions/upload-artifact@v4
        with:
          name: setup-windows
          path: dist/*-setup.exe

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
