[package]
name = "retype"
version = "0.1.1"
edition = "2024"
description = "Drop a file, get the neighbouring format back. Local, fast, no settings to learn."
license = "GPL-3.0-or-later"
repository = "https://github.com/bunkhq/retype"
readme = "README.md"

[dependencies]
arboard = "3.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
csv = "1.4"
dirs = "7"
drag = "2.1"
eframe = "0.37"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp", "ico", "tga"] }
psd = "0.3"
resvg = "0.49"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml = "1.2"
trash = "5.2"
tray-icon = "0.26"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
